<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工作日历">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>工作日程日历</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">工作日程日历</div>
  <div class="tools">
    <label class="fld">周期
      <input type="month" id="monthPick">
    </label>
    <button id="btnDrop" class="btn primary">导入聊天记录</button>
    <button id="btnAI" class="btn">AI 归纳</button>
    <button id="btnSync" class="btn">同步</button>
    <button id="btnExport" class="btn">导出</button>
    <button id="btnSettings" class="btn ghost">设置</button>
  </div>
</header>

<div class="dropzone" id="dropzone">
  <strong>把微信导出的聊天记录 .txt 拖到这里</strong>
  <span>也可拖入 daily.json 直接导入数据 · 或点击选择文件</span>
  <input type="file" id="fileInput" accept=".txt,.json,text/plain,application/json" hidden>
</div>

<main class="wrap">
  <div class="statbar">
    <span class="big">出勤 <em id="statWork">0</em> 天</span>
    <span class="rng" id="statRange"></span>
    <span class="sub" id="statSub"></span>
  </div>

  <div id="grid" class="grid"></div>

  <div class="legend">
    <span><i class="chip ev"></i>当日有工作产出</span>
    <span><i class="chip star"></i>聊天中明确要求记工时</span>
    <span>点格子可编辑 · 空白格 = 无记录 / 日期未到</span>
  </div>
  <div class="foot">
    <span>周期固定为每月 16 日 – 次月 15 日 · 数据保存在本机浏览器</span>
    <span id="syncState"></span>
  </div>
</main>

<!-- 编辑单日 -->
<div class="modal" id="editor">
  <div class="sheet">
    <h3 id="edTitle">编辑</h3>
    <label class="row"><span>当日事项（≤20 字）</span>
      <input type="text" id="edText" maxlength="40" placeholder="做了什么，不写人名"></label>
    <label class="row inline"><input type="checkbox" id="edWork"> 记工时</label>
    <label class="row"><span>备注</span>
      <input type="text" id="edNote" placeholder="如：晚 7–10 点值守"></label>
    <div class="rawbox" id="edRaw"></div>
    <div class="acts">
      <button class="btn ghost" id="edCancel">取消</button>
      <button class="btn primary" id="edSave">保存</button>
    </div>
  </div>
</div>

<!-- 解析预览 -->
<div class="modal" id="preview">
  <div class="sheet wide">
    <h3>聊天记录解析结果</h3>
    <p class="hint" id="pvMeta"></p>
    <div class="pvlist" id="pvList"></div>
    <div class="acts">
      <button class="btn ghost" id="pvCancel">取消</button>
      <button class="btn" id="pvGuess">用规则粗填</button>
      <button class="btn primary" id="pvApply">填入日历</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="modal" id="settings">
  <div class="sheet">
    <h3>设置</h3>
    <label class="row"><span>我的昵称（用于识别"我做了什么"，留空自动判断）</span>
      <input type="text" id="setMe" placeholder="如：纸盒"></label>
    <hr>
    <label class="row"><span>AI 接口地址（OpenAI 兼容）</span>
      <input type="text" id="setApi" placeholder="https://api.deepseek.com/v1/chat/completions"></label>
    <label class="row"><span>模型</span>
      <input type="text" id="setModel" placeholder="deepseek-chat"></label>
    <label class="row"><span>API Key（只存在本机）</span>
      <input type="password" id="setKey" placeholder="sk-..."></label>
    <hr>
    <label class="row"><span>同步地址（daily.json 的 raw 链接）</span>
      <input type="text" id="setSync" placeholder="https://raw.githubusercontent.com/.../data/daily.json"></label>
    <div class="acts">
      <button class="btn ghost" id="setClear">清空本周期</button>
      <button class="btn primary" id="setSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
